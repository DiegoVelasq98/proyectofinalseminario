# Plantilla de referencia — NO contiene valores reales y SÍ se puede subir a git.
# El Secret real se crea en el clúster con el comando de la guía de despliegue
# (lee los valores de tu .env.local real, que nunca se sube a git).
apiVersion: v1
kind: Secret
metadata:
  name: blautech-secrets
  namespace: dvelasquezp4
type: Opaque
stringData:
  DB_PASSWORD: "reemplaza-con-tu-contraseña-real"
  JWT_SECRET: "reemplaza-con-tu-secreto-jwt-real"
  GEMINI_API_KEY: "reemplaza-con-tu-api-key-real"
