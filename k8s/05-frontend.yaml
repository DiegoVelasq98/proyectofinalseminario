# Nota: dentro del clúster de Kubernetes solo exponemos HTTP (puerto 80); el acceso
# externo lo da el Ingress del final de este archivo (el clúster no permite NodePort).
# El nginx.conf original del proyecto trae además un bloque HTTPS (443) que
# exige los certificados de Let's Encrypt del VPS de producción; como ese
# demo de K8s es un clúster aparte (no el servidor de producción de
# blautech.online), montamos aquí una versión equivalente pero solo-HTTP
# de ese mismo archivo, para no tocar el Dockerfile ni el nginx.conf reales
# del proyecto. El proxy hacia el backend (/api/*) es idéntico al de producción.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-k8s
  namespace: dvelasquezp4
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 10M;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:9003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: dvelasquezp4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: diegovelasquez98/blautech-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-k8s-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: nginx-k8s-conf
          configMap:
            name: frontend-nginx-k8s
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dvelasquezp4
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: dvelasquezp4
spec:
  rules:
    - host: dvelasquezp4.35.188.164.62.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
