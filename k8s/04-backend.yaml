apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: curriculums-pvc
  namespace: dvelasquezp4
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dvelasquezp4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: diegovelasquez98/blautech-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9003
          envFrom:
            - configMapRef:
                name: blautech-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blautech-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: blautech-secrets
                  key: JWT_SECRET
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: blautech-secrets
                  key: GEMINI_API_KEY
          volumeMounts:
            - name: curriculums-storage
              mountPath: /app/archivos/curriculums
          readinessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9003
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "320Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
      volumes:
        - name: curriculums-storage
          persistentVolumeClaim:
            claimName: curriculums-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dvelasquezp4
spec:
  selector:
    app: backend
  ports:
    - port: 9003
      targetPort: 9003
