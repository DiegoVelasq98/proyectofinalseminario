# Certificado HTTPS (Let's Encrypt)
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
  namespace: dvelasquezp4
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            serviceType: ClusterIP
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: blautech-tls
  namespace: dvelasquezp4
spec:
  secretName: blautech-tls
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
  dnsNames:
    - dvelasquezp4.35.188.164.62.nip.io
