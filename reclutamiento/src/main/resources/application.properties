spring.application.name=reclutamiento
server.port=9003
##spring.datasource.url=jdbc:mysql://localhost:3306/blautech_bd?useSSL=false&serverTimezone=America/Guatemala
# Los ${VARIABLE:valor_por_defecto} de abajo permiten que, al correr en
# Docker, docker-compose inyecte variables de entorno (ver docker-compose.yml
# y .env) sin que tengas que tocar este archivo. Si NO hay variable de
# entorno definida (ej. corriendo normal en IntelliJ), se usa el valor por
# defecto de siempre -- tu flujo local no cambia en nada.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blautech_bd}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guatemala
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:developer98}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
jwt.secret=${JWT_SECRET:3j4EdoHFakNG0olu3E9iMKoJbQYc4Ller4l7NDOslnLxSNUATqNzw44mmwzQI_zN}
jwt.expiracion-ms=${JWT_EXPIRACION_MS:86400000}

# Orígenes permitidos para CORS (ver CorsConfig.java). Varios orígenes se
# separan con coma. En Docker, docker-compose define esta variable con la
# IP/dominio real del frontend; en local se queda con ng serve (4200).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Currículums: el candidato sube el archivo real (PDF/DOCX, máx. 5 MB) y
# se guarda en esta carpeta en el servidor. max-file-size/max-request-size
# tienen que ser mayores a 5 MB o Spring rechaza el archivo antes de que
# nuestro propio chequeo de tamaño (en CandidatoService) alcance a correr.
spring.servlet.multipart.max-request-size=7MB
spring.servlet.multipart.max-file-size=6MB
blautech.curriculums.directorio=archivos/curriculums

# Integración con la IA de Google Gemini para el análisis de coincidencia
# de habilidades (RF10/RF11, AnalisisService). Saca tu propia API key gratis
# en https://aistudio.google.com/apikey y pégala abajo en gemini.api.key.
# Si la dejas vacía, o pones gemini.api.habilitado=false, el sistema sigue
# funcionando normal: AnalisisService usa automáticamente el motor de
# reglas como respaldo, sin romper nada.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.5-flash-lite}
gemini.api.habilitado=${GEMINI_API_HABILITADO:true}

# Tamaño del pool de conexiones a MySQL. El valor por defecto de Hikari (10)
# se queda corto cuando el dashboard de RRHH dispara muchas consultas casi
# al mismo tiempo (una por cada vacante activa); con esto evitamos que esas
# consultas se queden esperando en fila.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# Correo de confirmación al candidato vía n8n (opcional). Apagado por defecto:
# con n8n.habilitado=false el sistema se comporta exactamente igual que antes.
# En Docker se activa con N8N_HABILITADO=true (ver docker-compose.yml).
n8n.habilitado=${N8N_HABILITADO:false}
n8n.webhook-url=${N8N_WEBHOOK_URL:http://n8n:5678/webhook}
