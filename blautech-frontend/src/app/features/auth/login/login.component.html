<div class="login-shell">
  <div class="login-card-outer">
    <div class="login-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.4"></circle>
        <path d="M5.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"></path>
      </svg>
    </div>

    <div class="login-card">
      <div class="login-marca">
        <span class="login-marca-punto"></span>
        <span>Blautech</span>
      </div>
      <p class="login-subtitulo">Sistema de Reclutamiento y Selección</p>

      <div class="alert-error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <form [formGroup]="form" (ngSubmit)="enviar()">
        <div class="campo-icono" [class.campo-error]="form.get('correo')?.touched && form.get('correo')?.invalid">
          <svg class="campo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m3.5 6.5 8.5 6 8.5-6"></path>
          </svg>
          <input id="correo" type="email" formControlName="correo" placeholder="Correo electrónico" />
        </div>
        <span class="error-msg" *ngIf="form.get('correo')?.touched && form.get('correo')?.invalid">
          Ingresa un correo válido.
        </span>

        <div class="campo-icono" [class.campo-error]="form.get('contrasena')?.touched && form.get('contrasena')?.invalid">
          <svg class="campo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.5" y="10.5" width="15" height="10" rx="2"></rect>
            <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"></path>
          </svg>
          <input id="contrasena" type="password" formControlName="contrasena" placeholder="Contraseña" />
        </div>
        <span class="error-msg" *ngIf="form.get('contrasena')?.touched && form.get('contrasena')?.invalid">
          La contraseña es obligatoria.
        </span>

        <div class="login-extra">
          <label class="recordarme">
            <input type="checkbox" />
            <span>Recordarme</span>
          </label>
        </div>

        <button class="btn-login" type="submit" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <p class="login-footer">¿No tienes cuenta? <a routerLink="/registro">Crear una cuenta</a></p>
    </div>
  </div>
</div>
