# Bloque HTTP (puerto 80): se mantiene activo para que el sistema siga
# funcionando por IP (sin dominio) o mientras se termina de configurar
# HTTPS. No redirige automáticamente a HTTPS para no romper el acceso
# por IP pelada, que no tiene certificado válido.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:9003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# Bloque HTTPS (puerto 443) para blautech.online, usando el certificado
# de Let's Encrypt. Los archivos se montan desde el host (ver
# docker-compose.yml, carpeta /etc/letsencrypt del VPS) hacia
# /etc/nginx/ssl dentro del contenedor.
server {
    listen 443 ssl;
    server_name blautech.online www.blautech.online;

    ssl_certificate /etc/nginx/ssl/live/blautech.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/blautech.online/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:9003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
